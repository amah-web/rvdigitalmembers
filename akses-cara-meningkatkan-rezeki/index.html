<!DOCTYPE html>
<html lang="id" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&amp;family=Roboto:wght@400;700&amp;family=Poppins:wght@400;600;700&amp;family=Montserrat:wght@400;700;800&amp;family=Open+Sans:wght@400;600;700&amp;family=Lato:wght@400;700&amp;family=Playfair+Display:wght@700&amp;family=Oswald:wght@400;700&amp;family=Raleway:wght@400;700&amp;family=Ubuntu:wght@400;700&amp;display=swap" rel="stylesheet">
    <script>
        tailwind.config = { darkMode: 'class' };
        
        // Listen for theme changes from parent window
        window.addEventListener('message', (e) => {
            if (e.data.type === 'SYNC_THEME') {
                if (e.data.theme === 'dark') document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }
        });
    </script>
    <style>
        :root {
            --font-heading: 'Poppins', sans-serif;
            --font-body: 'Inter', sans-serif;
            --color-primary: #f88379; /* Dipakai sbg fallback warna link footer */
            --color-text: #334155;
        }

        /* Base Styles */
        body { font-family: var(--font-body); color: var(--color-text); transition: background-color 0.3s ease, color 0.3s ease; }
        .container { max-width: 600px; margin: 0 auto; text-align: center; }
        
        h1 { 
            font-family: var(--font-heading); 
            font-size: clamp(2rem, 5vw, 2.5rem); 
            font-weight: 800; 
            margin: 0 0 16px; 
            outline:none; 
            letter-spacing:-1px; 
            line-height: 1.2; 
            color: #1e293b;
        }
        .desc { font-size: 1.125rem; margin: 0 0 24px; outline:none; line-height: 1.6; }
        
        /* Components */
        .section-tag { font-family: var(--font-heading); font-size: 11px; font-weight: 800; text-transform: uppercase; color: #94a3b8; display: block; margin-bottom: 14px; text-align: left; letter-spacing:1px; }
        .card-item { border-radius: 20px; padding: 24px; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; border-width: 1px; box-shadow: 0 4px 15px -3px rgba(0,0,0,0.05); border-color: #f1f5f9; transition: transform 0.2s; gap: 16px; }
        .card-item:hover { transform: translateY(-2px); }
        .dark .card-item { border-color: #1e293b; background-color: #0f172a; }
        
        /* Button Global Styles */
        .btn-coral {
            background: linear-gradient(135deg, #f88379, #9333ea);
            color: #ffffff;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 12px;
            display: inline-block;
            transition: opacity 0.2s, transform 0.2s;
            box-shadow: 0 10px 20px -5px rgba(0,0,0,0.15);
            border: none;
        }
        .btn-coral:hover { opacity: 0.9; transform: translateY(-1px); }

        /* Footer Area */
        .footer { margin-top: 80px; padding-top: 40px; border-top-width: 1px; border-color: #e2e8f0; }
        .dark .footer { border-color: #1e293b; }
        .badge { background: #f1f5f9; padding: 6px 16px; border-radius: 99px; font-size: 11px; font-weight: 800; color: #64748b; margin-bottom: 20px; display: inline-block; outline:none; }
        .dark .badge { background: #1e293b; color: #94a3b8; }
        .support-link { color: var(--color-primary); font-weight: 800; text-decoration: none; font-size: 20px; outline:none; display:inline-block; transition: opacity 0.2s; }
        .support-link:hover { opacity: 0.8; }
        
        /* Editor Helpers */
        [contenteditable]:hover { outline: 1px dashed #cbd5e1; outline-offset: 4px; border-radius: 4px; }
        .dark [contenteditable]:hover { outline-color: #475569; }
        [contenteditable]:focus { outline: 2px solid #f88379; outline-offset: 4px; border-radius: 4px; background: rgba(248,131,121,0.05); }
        
        /* Floating Toolbar (Removed on export) */
        #imers-toolbar { 
            display:none; position:fixed; background:#fff; border:1px solid #e2e8f0; padding:16px; 
            border-radius:16px; box-shadow:0 20px 40px -10px rgba(0,0,0,0.2); z-index:9999; 
            flex-direction:column; gap:12px; min-width:260px; color: #334155;
            font-family: sans-serif;
        }
        .dark #imers-toolbar { background: #0f172a; border-color: #1e293b; color: #f1f5f9; }
        .tool-row { display:flex; gap:8px; align-items:center; }
        .tool-btn { padding:6px 14px; border:1px solid #e2e8f0; border-radius:8px; background:#f8fafc; font-weight:bold; cursor:pointer; font-size:12px; transition: all 0.2s; }
        .tool-btn:hover { background: #e2e8f0; }
        .dark .tool-btn { background: #1e293b; border-color: #334155; color: white; }
        .dark .tool-btn:hover { background: #334155; }
        .tool-label { font-size:9px; font-weight:800; color:#94a3b8; text-transform:uppercase; margin-bottom:6px; display:block; }
        select.tool-select { font-size:12px; padding:8px; border-radius:8px; border:1px solid #e2e8f0; width:100%; cursor:pointer; font-weight:600; background: transparent; outline:none; }
        .dark select.tool-select { border-color: #334155; color: white; background: #0f172a;}
    </style>
